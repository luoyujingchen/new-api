# External dependencies only (for local development)
#
# Usage:
#   1. docker compose -f docker-compose.deps.yml up -d
#   2. Backend: go run main.go (uses SQL_DSN and REDIS_CONN_STRING below)
#   3. Frontend: cd web/default && bun run dev
#
# Environment variables for local development:
#   SQL_DSN=postgresql://root:123456@localhost:5432/new-api
#   REDIS_CONN_STRING=redis://:123456@localhost:6379

services:
  redis:
    image: redis:7-alpine
    container_name: new-api-dev-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "123456"]
    ports:
      - "6379:6379"
    networks:
      - dev-network

  postgres:
    image: postgres:15-alpine
    container_name: new-api-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: new-api
    ports:
      - "5432:5432"
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  dev_pg_data:

networks:
  dev-network:
    driver: bridge
