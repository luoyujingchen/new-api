# Production offline Docker Compose.
#
# Usage:
#   1. Load all images on the target host before starting this stack.
#   2. Build or load the application image as new-api-local:offline.
#   3. docker compose -f docker-compose.prod-offline.yml up -d
#
# Required local images:
#   new-api-local:offline
#   redis:7.2-alpine
#   postgres:15-alpine
#   apache/kafka:3.7.1
#   clickhouse/clickhouse-server:24.8
#
# Change all default passwords and secrets before production use. If a password
# contains URL special characters, URL-encode it in SQL_DSN / REDIS_CONN_STRING.

name: new-api-prod-offline

services:
  new-api:
    image: new-api-local:offline
    pull_policy: never
    container_name: new-api-prod-offline
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "${NEWAPI_HTTP_PORT:-3000}:3000"
    volumes:
      - new_api_data:/data
      - new_api_logs:/app/logs
    environment:
      SQL_DSN: postgresql://root:${NEWAPI_POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/new-api # 主业务库；生产请改密码。
      REDIS_CONN_STRING: redis://:${NEWAPI_REDIS_PASSWORD:-change_me_redis_password}@redis:6379 # Redis 缓存；生产请改密码。
      TZ: Asia/Shanghai
      NODE_TYPE: master # 单节点离线部署使用 master；多节点只保留一个 master 负责定时任务和 outbox 发布。
      NODE_NAME: new-api-prod-offline-1 # 节点名会进入审计日志，便于排查多节点问题。
      SESSION_SECRET: ${NEWAPI_SESSION_SECRET:-change_me_session_secret_32_chars_min} # 多节点/生产必须改成稳定随机字符串。
      ERROR_LOG_ENABLED: "true" # 启用错误日志。
      BATCH_UPDATE_ENABLED: "true" # 启用批量更新，降低数据库写入压力。

      LOG_OUTBOX_PUBLISHER_ENABLED: "true" # 启用日志 outbox 发布器，将用量/审计日志投递到 Kafka 和 ClickHouse。
      LOG_OUTBOX_BATCH_SIZE: "100" # 每轮每个 sink 最多处理的 outbox 数量。
      LOG_OUTBOX_PUBLISH_INTERVAL_SECONDS: "5" # 发布轮询间隔，单位秒。
      LOG_OUTBOX_PROCESSING_LEASE_SECONDS: "300" # processing 租约，进程异常后超过该时间可被重新领取。
      LOG_OUTBOX_MAX_BACKOFF_SECONDS: "300" # sink 发布失败后的最大重试退避，单位秒。
      LOG_OUTBOX_KAFKA_BROKERS: kafka:9092 # Kafka broker 地址；多个 broker 用英文逗号分隔。
      LOG_OUTBOX_KAFKA_USAGE_TOPIC: newapi.usage_logs.v1 # 用量日志 topic。
      LOG_OUTBOX_KAFKA_AUDIT_TOPIC: newapi.audit_logs.v1 # 审计日志 topic。
      LOG_OUTBOX_CLICKHOUSE_URL: http://clickhouse:8123 # ClickHouse HTTP 地址，应用会自动建表。
      LOG_OUTBOX_CLICKHOUSE_DATABASE: newapi_logs # ClickHouse 日志库名。
      LOG_OUTBOX_CLICKHOUSE_USERNAME: newapi # ClickHouse 写入用户。
      LOG_OUTBOX_CLICKHOUSE_PASSWORD: ${NEWAPI_CLICKHOUSE_PASSWORD:-change_me_clickhouse_password} # ClickHouse 写入密码，需与 clickhouse 服务一致。
      LOG_OUTBOX_CLICKHOUSE_TIMEOUT_SECONDS: "15" # ClickHouse HTTP 写入超时，单位秒。
      LOG_OUTBOX_CLICKHOUSE_TTL_DAYS: "180" # ClickHouse 日志表 TTL，单位天。

      USAGE_LOG_PAYLOAD_CAPTURE_ENABLED: "true" # 启用请求/响应文本 payload 捕获；生产需确认合规和脱敏要求。
      USAGE_LOG_PAYLOAD_CAPTURE_MAX_BYTES: "2097152" # 单个文本 payload 字段最大捕获字节数，2097152 = 2 MiB；超出会截断并标记 truncated。
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    networks:
      - new-api-offline-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    pull_policy: never
    container_name: new-api-prod-offline-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${NEWAPI_REDIS_PASSWORD:-change_me_redis_password}"]
    volumes:
      - redis_data:/data
    networks:
      - new-api-offline-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${NEWAPI_REDIS_PASSWORD:-change_me_redis_password}' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    pull_policy: never
    container_name: new-api-prod-offline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${NEWAPI_POSTGRES_PASSWORD:-change_me_postgres_password}
      POSTGRES_DB: new-api
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - new-api-offline-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.1
    pull_policy: never
    container_name: new-api-prod-offline-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk # 单节点 KRaft 集群 ID；首次启动后不要修改。
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # 生产建议显式建 topic，由 kafka-init 完成。
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - new-api-offline-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-init:
    image: apache/kafka:3.7.1
    pull_policy: never
    container_name: new-api-prod-offline-kafka-init
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic newapi.usage_logs.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic newapi.audit_logs.v1 --partitions 3 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - new-api-offline-network

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    pull_policy: never
    container_name: new-api-prod-offline-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: newapi_logs
      CLICKHOUSE_USER: newapi
      CLICKHOUSE_PASSWORD: ${NEWAPI_CLICKHOUSE_PASSWORD:-change_me_clickhouse_password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    networks:
      - new-api-offline-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user $$CLICKHOUSE_USER --password $$CLICKHOUSE_PASSWORD --query 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  new_api_data:
  new_api_logs:
  redis_data:
  postgres_data:
  kafka_data:
  clickhouse_data:
  clickhouse_logs:

networks:
  new-api-offline-network:
    driver: bridge
